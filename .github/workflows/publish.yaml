name: '🚀 Publish Plugin'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to package (for example v1.0.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install repository manager
        run: python -m pip install 'jprm==1.1.0'

      - name: Validate release and test
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must have four numeric version components (optional v prefix).'
            exit 1
          fi
          dotnet test Jellyfin.Plugin.AnimatedAlbumArt.slnx -c Release --nologo

      - name: Build package and repository manifest
        run: |
          mkdir -p artifacts
          jprm plugin build . --dotnet-framework net10.0 --version "${RELEASE_TAG#v}"
          jprm repo init artifacts/manifest.json
          for package in artifacts/*.zip; do
            jprm repo add --plugin-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$(basename "$package")" artifacts/manifest.json "$package"
          done

      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/manifest.json --repo "$GITHUB_REPOSITORY" --clobber
